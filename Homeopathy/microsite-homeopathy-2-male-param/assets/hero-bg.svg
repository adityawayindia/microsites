<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7fc"/>
      <stop offset="0.55" stop-color="#eceffa"/>
      <stop offset="1" stop-color="#dfe4f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7cd7a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f7cd7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globule" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dcef"/>
    </radialGradient>
    <g id="petals">
      <path d="M0 0 C 10 -30 10 -62 0 -86 C -10 -62 -10 -30 0 0Z"/>
    </g>
    <g id="flower" fill="none" stroke="#34489a" stroke-width="2" stroke-linecap="round">
      <use href="#petals"/>
      <use href="#petals" transform="rotate(24)"/>
      <use href="#petals" transform="rotate(48)"/>
      <use href="#petals" transform="rotate(72)"/>
      <use href="#petals" transform="rotate(96)"/>
      <use href="#petals" transform="rotate(120)"/>
      <use href="#petals" transform="rotate(144)"/>
      <use href="#petals" transform="rotate(168)"/>
      <use href="#petals" transform="rotate(192)"/>
      <use href="#petals" transform="rotate(216)"/>
      <use href="#petals" transform="rotate(240)"/>
      <use href="#petals" transform="rotate(264)"/>
      <use href="#petals" transform="rotate(288)"/>
      <use href="#petals" transform="rotate(312)"/>
      <use href="#petals" transform="rotate(336)"/>
      <circle r="18" fill="#f7cd7a" fill-opacity="0.55"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- dilution rings (potentisation motif) -->
  <g fill="none" stroke="#9aa6d6" stroke-opacity="0.35">
    <circle cx="1240" cy="430" r="200" stroke-width="1.5"/>
    <circle cx="1240" cy="430" r="280" stroke-width="1.2" stroke-dasharray="4 10"/>
    <circle cx="1240" cy="430" r="370" stroke-width="1"/>
    <circle cx="1240" cy="430" r="470" stroke-width="1" stroke-dasharray="2 14"/>
  </g>
  <circle cx="1240" cy="430" r="320" fill="url(#glow)"/>

  <!-- arnica / calendula line flowers -->
  <g opacity="0.22">
    <use href="#flower" transform="translate(1500 140) scale(0.9)"/>
    <use href="#flower" transform="translate(960 800) scale(0.65) rotate(12)"/>
    <use href="#flower" transform="translate(1530 760) scale(0.55) rotate(-8)"/>
  </g>
  <g fill="none" stroke="#34489a" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round">
    <path d="M1500 226 C 1490 330 1450 420 1420 520"/>
    <path d="M1462 360 C 1420 340 1390 300 1384 262 C 1420 270 1450 300 1462 360Z"/>
    <path d="M1440 440 C 1490 420 1520 380 1530 344 C 1490 352 1456 390 1440 440Z"/>
  </g>

  <!-- remedy vial with globules -->
  <g transform="translate(1010 150) rotate(-14)" opacity="0.32" fill="none" stroke="#1f2f66" stroke-width="2.2">
    <rect x="0" y="0" width="64" height="34" rx="6" fill="#d7dcef" fill-opacity="0.6"/>
    <path d="M6 34 v8 h52 v-8"/>
    <rect x="2" y="42" width="60" height="170" rx="16"/>
    <g stroke="none" fill="#9aa6d6">
      <circle cx="18" cy="190" r="9"/><circle cx="38" cy="194" r="9"/><circle cx="50" cy="176" r="8"/>
      <circle cx="26" cy="172" r="8"/><circle cx="40" cy="156" r="8"/><circle cx="18" cy="150" r="7"/>
    </g>
  </g>

  <!-- scattered globules -->
  <g>
    <circle cx="880" cy="120" r="9" fill="url(#globule)"/>
    <circle cx="905" cy="140" r="6" fill="url(#globule)"/>
    <circle cx="1150" cy="810" r="11" fill="url(#globule)"/>
    <circle cx="1180" cy="826" r="7" fill="url(#globule)"/>
    <circle cx="1560" cy="470" r="8" fill="url(#globule)"/>
    <circle cx="1380" cy="96" r="7" fill="url(#globule)"/>
  </g>

  <!-- dotted botanical grid, faint on the text side -->
  <g fill="#34489a" fill-opacity="0.07">
    <circle cx="80" cy="80" r="2"/><circle cx="140" cy="80" r="2"/><circle cx="200" cy="80" r="2"/>
    <circle cx="80" cy="140" r="2"/><circle cx="140" cy="140" r="2"/><circle cx="200" cy="140" r="2"/>
    <circle cx="80" cy="200" r="2"/><circle cx="140" cy="200" r="2"/><circle cx="200" cy="200" r="2"/>
    <circle cx="80" cy="760" r="2"/><circle cx="140" cy="760" r="2"/><circle cx="80" cy="820" r="2"/><circle cx="140" cy="820" r="2"/>
  </g>
</svg>
