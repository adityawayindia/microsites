<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 320" role="img" aria-labelledby="title desc">
  <title id="title">Homeopathy consultation banner</title>
  <desc id="desc">Indigo and saffron clinic banner with abstract remedy bottle and consultation message.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#152a46"/>
      <stop offset="0.62" stop-color="#1f4e79"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="2048" height="320" rx="28" fill="url(#g)"/>
  <rect width="2048" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1780" cy="28" r="190" fill="none" stroke="#d97706" stroke-opacity=".5" stroke-width="3"/>
  <circle cx="1780" cy="28" r="128" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
  <g transform="translate(1590 66)">
    <rect x="0" y="44" width="170" height="118" rx="44" fill="#f6f3ec" fill-opacity=".96"/>
    <rect x="52" y="12" width="66" height="54" rx="18" fill="#d97706"/>
    <circle cx="56" cy="105" r="11" fill="#d97706" fill-opacity=".85"/>
    <circle cx="88" cy="132" r="11" fill="#0f766e" fill-opacity=".8"/>
    <circle cx="120" cy="104" r="11" fill="#1f4e79" fill-opacity=".8"/>
  </g>
  <text x="100" y="116" fill="#f6f3ec" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">CLINIC AND ONLINE CONSULTATIONS</text>
  <text x="100" y="188" fill="#ffffff" font-family="Newsreader, Georgia, serif" font-size="58" font-weight="700">Thoughtful case taking. Clear follow up.</text>
  <text x="100" y="244" fill="#dce8f2" font-family="Inter, Arial, sans-serif" font-size="25">Homeopathy appointments with Dr. Advait Rao</text>
  <rect x="100" y="270" width="320" height="8" rx="4" fill="#d97706"/>
</svg>
