<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Homeopathy consultation banner</title>
  <desc id="desc">Indigo and saffron mobile clinic banner with remedy bottle motif.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152a46"/>
      <stop offset=".65" stop-color="#1f4e79"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="500" rx="32" fill="url(#g)"/>
  <rect width="1600" height="500" rx="32" fill="url(#grid)"/>
  <circle cx="1360" cy="50" r="220" fill="none" stroke="#d97706" stroke-opacity=".45" stroke-width="4"/>
  <text x="80" y="120" fill="#f6f3ec" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">HOMEOPATHY APPOINTMENTS</text>
  <text x="80" y="230" fill="#ffffff" font-family="Newsreader, Georgia, serif" font-size="76" font-weight="700">Thoughtful care.</text>
  <text x="80" y="316" fill="#ffffff" font-family="Newsreader, Georgia, serif" font-size="76" font-weight="700">Clear follow up.</text>
  <text x="80" y="390" fill="#dce8f2" font-family="Inter, Arial, sans-serif" font-size="29">Clinic and online consultations</text>
  <rect x="80" y="432" width="360" height="10" rx="5" fill="#d97706"/>
</svg>
