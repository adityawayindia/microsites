<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Soft illustration of a stethoscope, medical crosses, pills and a thermometer on a warm cream background">
  <defs>
    <radialGradient id="glowPeach" cx="12%" cy="10%" r="55%">
      <stop offset="0" stop-color="#f6c9ad" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f6c9ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSage" cx="92%" cy="92%" r="55%">
      <stop offset="0" stop-color="#bfe3d3" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#bfe3d3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSand" cx="55%" cy="40%" r="40%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#8a3f24" fill-opacity="0.13"/>
    </pattern>
    <!-- medical cross, centred on 0,0 -->
    <g id="cross">
      <rect x="-9" y="-28" width="18" height="56" rx="6"/>
      <rect x="-28" y="-9" width="56" height="18" rx="6"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#fbf3ea"/>
  <rect width="1600" height="900" fill="url(#glowPeach)"/>
  <rect width="1600" height="900" fill="url(#glowSage)"/>
  <rect width="1600" height="900" fill="url(#glowSand)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- big soft rings, like the diaphragm of a chest piece -->
  <g fill="none" stroke="#8a3f24" stroke-opacity="0.17" stroke-width="2">
    <circle cx="1330" cy="250" r="230"/>
    <circle cx="1330" cy="250" r="170"/>
    <circle cx="1330" cy="250" r="110"/>
  </g>

  <!-- stethoscope, top right -->
  <g transform="translate(1090 36) scale(0.92)" fill="none" stroke="#8a3f24" stroke-opacity="0.38" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 22 C60 190 120 250 200 250 C280 250 340 190 340 22"/>
    <path d="M200 250 L200 350 C200 462 332 462 332 372 C332 318 270 318 270 372"/>
    <circle cx="60" cy="14" r="13" fill="#8a3f24" fill-opacity="0.38" stroke="none"/>
    <circle cx="340" cy="14" r="13" fill="#8a3f24" fill-opacity="0.38" stroke="none"/>
    <circle cx="270" cy="404" r="38" fill="#fbf3ea" fill-opacity="0.9"/>
    <circle cx="270" cy="404" r="16" stroke-width="8"/>
  </g>

  <!-- medical crosses -->
  <g fill="#8a3f24" fill-opacity="0.22">
    <use href="#cross" transform="translate(120 110) scale(0.9)"/>
    <use href="#cross" transform="translate(860 430) scale(0.7) rotate(18)"/>
    <use href="#cross" transform="translate(1500 560) scale(0.8)"/>
  </g>
  <g fill="#135340" fill-opacity="0.24">
    <use href="#cross" transform="translate(1010 170) scale(0.5)"/>
    <use href="#cross" transform="translate(60 470) scale(0.6) rotate(-12)"/>
    <use href="#cross" transform="translate(1180 800) scale(0.9)"/>
  </g>

  <!-- capsule pill, top left -->
  <g transform="translate(250 250) rotate(-32)">
    <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#8a3f24" fill-opacity="0.28"/>
    <path d="M0 -24 H46 A24 24 0 0 1 46 24 H0 Z" fill="#135340" fill-opacity="0.22"/>
    <rect x="-56" y="-14" width="52" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- thermometer, lower left -->
  <g transform="translate(130 640) rotate(28)">
    <rect x="-14" y="-110" width="28" height="170" rx="14" fill="#ffffff" fill-opacity="0.65" stroke="#8a3f24" stroke-opacity="0.4" stroke-width="4"/>
    <circle cx="0" cy="68" r="26" fill="#ffffff" fill-opacity="0.65" stroke="#8a3f24" stroke-opacity="0.4" stroke-width="4"/>
    <circle cx="0" cy="68" r="14" fill="#a4482b" fill-opacity="0.3"/>
    <rect x="-4" y="-60" width="8" height="120" rx="4" fill="#a4482b" fill-opacity="0.3"/>
    <g stroke="#8a3f24" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round">
      <path d="M-14 -90 H-4"/><path d="M-14 -70 H-8"/><path d="M-14 -50 H-4"/><path d="M-14 -30 H-8"/>
    </g>
  </g>

  </svg>
