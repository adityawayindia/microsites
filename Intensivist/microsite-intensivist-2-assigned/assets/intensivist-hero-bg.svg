<svg width="1440" height="500" viewBox="0 0 1440 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ecg-line {
      stroke-dasharray: 2500;
      stroke-dashoffset: 2500;
      opacity: 0;
    }
    
    .ecg-line-1 {
      animation: ecgSweep1 6s linear infinite;
    }
    .ecg-line-2 {
      animation: ecgSweep2 6s linear infinite;
    }
    .ecg-line-3 {
      animation: ecgSweep3 6s linear infinite;
    }

    @keyframes ecgSweep1 {
      0% { stroke-dashoffset: 2500; opacity: 1; }
      66.66% { stroke-dashoffset: 0; opacity: 1; }
      66.67% { stroke-dashoffset: 2500; opacity: 0; }
      100% { stroke-dashoffset: 2500; opacity: 0; }
    }
    
    @keyframes ecgSweep2 {
      0% { stroke-dashoffset: 2500; opacity: 0; }
      33.33% { stroke-dashoffset: 2500; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    
    @keyframes ecgSweep3 {
      0% { stroke-dashoffset: 1250; opacity: 1; }
      33.33% { stroke-dashoffset: 0; opacity: 1; }
      33.34% { stroke-dashoffset: 2500; opacity: 0; }
      66.66% { stroke-dashoffset: 2500; opacity: 0; }
      66.67% { stroke-dashoffset: 2500; opacity: 1; }
      100% { stroke-dashoffset: 1250; opacity: 1; }
    }
  </style>
  
  <!-- Telemetry Grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(2, 132, 199, 0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="30%" stop-color="#0db882"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="70%" stop-color="#0db882"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- ECG Heartbeat Line 1 (Top, Smaller Amplitude) -->
  <path class="ecg-line ecg-line-1" d="M0 100 L 250 100 Q 260 92 270 100 T 290 100 L 320 100 L 330 110 L 340 40 L 350 160 L 360 95 L 370 100 L 400 100 Q 420 82 440 100 T 460 100 L 750 100 Q 760 92 770 100 T 790 100 L 820 100 L 830 110 L 840 40 L 850 160 L 860 95 L 870 100 L 900 100 Q 920 82 940 100 T 960 100 L 1440 100" 
        stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ECG Heartbeat Line 2 (Middle, Smaller Amplitude) -->
  <path class="ecg-line ecg-line-2" d="M0 250 L 250 250 Q 260 242 270 250 T 290 250 L 320 250 L 330 260 L 340 190 L 350 310 L 360 245 L 370 250 L 400 250 Q 420 232 440 250 T 460 250 L 750 250 Q 760 242 770 250 T 790 250 L 820 250 L 830 260 L 840 190 L 850 310 L 860 245 L 870 250 L 900 250 Q 920 232 940 250 T 960 250 L 1440 250" 
        stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ECG Heartbeat Line 3 (Bottom, Smaller Amplitude) -->
  <path class="ecg-line ecg-line-3" d="M0 400 L 250 400 Q 260 392 270 400 T 290 400 L 320 400 L 330 410 L 340 340 L 350 460 L 360 395 L 370 400 L 400 400 Q 420 382 440 400 T 460 400 L 750 400 Q 760 392 770 400 T 790 400 L 820 400 L 830 410 L 840 340 L 850 460 L 860 395 L 870 400 L 900 400 Q 920 382 940 400 T 960 400 L 1440 400" 
        stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
